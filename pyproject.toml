[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp"
version = "1.0.0"
description = "Telegram integration for Claude via the Model Context Protocol"
readme = "README.md"
authors = [
    {name = "KiaroSama"}
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
# "Private :: Do Not Upload" is not a registered trove prefix, so PyPI rejects any
# upload carrying it. That is deliberate and survives every licence change: the
# telegram-mcp name on PyPI belongs to a DIFFERENT project, and install_guard.py
# already refuses a PyPI-installed copy at import. Publishing the source is a
# separate decision from publishing a package - delete this line only when the
# second one is actually being made, and under a name that is free.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    # The floor is 3.11 because the suite needs it: tests/test_packaging.py imports
    # tomllib with no fallback. Nothing in the runtime forces it, so this is a
    # support decision - claim only what CI exercises.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
    # Image encoding/scaling for the visual capture and media preview tools.
    "pillow>=11.0",
    "python-dotenv>=1.2.3",
    # UAX #29 grapheme clusters (\X) so truncation never splits a compound
    # character; a hand-rolled scan kept missing categories.
    "regex>=2026.9.10",
    "python-json-logger>=4.2.0",
    "qrcode>=8.2",
    "telethon>=1.45.0",
    # MTProto 2.0 end-to-end encryption, which Telethon never implemented. Pinned
    # BY GIT to this owner's repository and never declared by bare name: PyPI
    # already serves a different `telethon-secret-chat` — painor's archived 0.2.4 —
    # at a HIGHER version than this one, so a bare requirement resolves to the wrong
    # project and no version constraint reveals the substitution.
    #
    # Taking a newer version is one edit here plus
    # `uv lock --upgrade-package telethon-secret-chat`; nothing in this project's
    # source should need to change, because `telegram_mcp/secret_backend.py` is the
    # only module that imports it and a contract test pins what it relies on.
    "telethon-secret-chat @ git+https://github.com/KiaroSama/Telethon-Secret-Chat.git@7fcda4c30cfda1aded831d03c52159c69a142691",
]

[project.optional-dependencies]
# Required only when TELEGRAM_PROXY_TYPE is set to socks5/socks4/http.
proxy = [
    "python-socks>=3.1.1",
]
# Renders .tgs (gzipped Lottie) animated stickers and custom emoji into frames.
# Optional because it ships a native rlottie build; without it those media fall
# back to Telegram's static thumbnail or a Telegram Desktop capture.
lottie = [
    "rlottie-python>=1.3.8",
]
# `secret` was an extra until secret chats stopped being optional, and the
# encryption is a plain dependency now. Kept as an empty alias so
# `pip install -e .[secret]`, which the docs recommended, does not start failing
# for anyone who copied it.
secret = []

[project.urls]
"Homepage" = "https://github.com/KiaroSama/telegram-mcp"
"Bug Tracker" = "https://github.com/KiaroSama/telegram-mcp/issues"

[tool.setuptools]
py-modules = ["main", "session_string_generator"]

# Discovered rather than listed: a hand-maintained list silently drops any new
# subpackage from the wheel, and the failure only shows up as an ImportError at
# runtime on an installed copy, never in the source tree.
[tool.setuptools.packages.find]
include = ["telegram_mcp*"]
namespaces = false

[project.scripts]
telegram-mcp = "main:main"
telegram-mcp-generate-session = "session_string_generator:main"

[tool.black]
line-length = 99
target-version = ['py311']

[dependency-groups]
dev = [
    "black>=25.9.0",
    # tests/test_packaging.py builds a real wheel and imports the installed copy;
    # without these it skips, and a broken package list ships unnoticed.
    "build>=1.6.1",
    "flake8>=7.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "setuptools>=68",
    "wheel>=0.42",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
# Paths are recorded relative to this file's directory rather than to the
# checkout root, so a data file written under /home/runner/work/... and one
# written under D:\a\... name the same modules and `coverage combine`
# can merge them. Required by the combine step in .github/workflows/tests.yml.
#
# It also normalises the separator: a relative path is stored with '/' even
# when it was recorded on Windows. Verified by dumping the `file` table of a
# data file written here. So no [tool.coverage.paths] aliasing is needed, and
# adding some would only introduce patterns that can silently stop matching.
relative_files = true
# What is measured: every module whose behaviour a test can pin down without a
# live Telegram connection. That is the rule - not "the fork's own modules" and
# not "anything outside tools/". telegram_mcp.media_transfer sits outside tools/
# yet is measured, because byte budgets, thumbnail selection and reference retry
# are decisions, testable against a mocked client.
#
# What stays out: the telegram_mcp.tools.* adapters. They marshal arguments to
# Telethon and format what comes back, so measuring them rewards mocking the API
# rather than testing anything. Their behavioural coverage is a separate effort.
source = [
    "main",
    "session_string_generator",
    "telegram_mcp.account_config",
    "telegram_mcp.account_lifecycle",
    "telegram_mcp.account_snapshot",
    "telegram_mcp.admission",
    "telegram_mcp.alias_store",
    "telegram_mcp.aliases",
    "telegram_mcp.button_view",
    "telegram_mcp.client_identity",
    "telegram_mcp.connection",
    "telegram_mcp.console_theme",
    "telegram_mcp.contact_sheet",
    "telegram_mcp.effect_catalog",
    "telegram_mcp.dialog_warm",
    "telegram_mcp.file_roots",
    "telegram_mcp.entities",
    "telegram_mcp.errors",
    "telegram_mcp.forum",
    "telegram_mcp.log_setup",
    "telegram_mcp.handles",
    "telegram_mcp.install_guard",
    "telegram_mcp.gif_handles",
    "telegram_mcp.media_album",
    "telegram_mcp.media_kinds",
    "telegram_mcp.media_preview",
    "telegram_mcp.media_send",
    "telegram_mcp.media_transfer",
    "telegram_mcp.message_view",
    "telegram_mcp.ogg_tags",
    "telegram_mcp.owner_only",
    "telegram_mcp.paging",
    "telegram_mcp.personal",
    "telegram_mcp.photo_source",
    "telegram_mcp.proxy",
    "telegram_mcp.reconnect",
    "telegram_mcp.retirement",
    "telegram_mcp.rich_blocks",
    "telegram_mcp.runner",
    "telegram_mcp.runtime",
    "telegram_mcp.sanitize",
    "telegram_mcp.secret_backend",
    "telegram_mcp.secret_common",
    "telegram_mcp.secret_compose",
    "telegram_mcp.secret_history",
    "telegram_mcp.secret_limits",
    "telegram_mcp.secret_media_content",
    "telegram_mcp.safe_log",
    "telegram_mcp.sent",
    "telegram_mcp.session_files",
    "telegram_mcp.session_pool",
    "telegram_mcp.tool_budget",
    "telegram_mcp.settings",
    "telegram_mcp.syscalls",
    "telegram_mcp.singleton",
    "telegram_mcp.text_fidelity",
    "telegram_mcp.video_dims",
    "telegram_mcp.visual",
    "telegram_mcp.win_handles",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A measured floor over the UNION of both platforms, which is the only number
# that describes this project. Measured 2026-08-27, on the first CI runs this
# repository ever had: 85.49% on Windows, 81.90% on Linux, same commit, same
# suite. The gap is not a testing gap. telegram_mcp.visual.capture is Win32
# (PrintWindow) and 110 of its lines cannot execute on Linux at all, while the
# POSIX branches of handles.py, owner_only.py and singleton.py cannot execute
# on Windows. Gating either number on its own measures the runner.
#
# So every test job writes its own data file and the `coverage` job combines
# them and applies this floor once. See .github/workflows/tests.yml.
fail_under = 85
